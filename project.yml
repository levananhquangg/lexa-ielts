name: Lexa
options:
  bundleIdPrefix: com.lexa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  Lexa:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources
    dependencies:
      - target: LexaWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lexa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.lexa.vocab
            CFBundleURLSchemes: [lexa]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Lexa.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lexa.vocab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexa.vocab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  LexaWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - Resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Lexa Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/LexaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lexa.vocab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexa.vocab.widget
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  Lexa:
    build:
      targets:
        Lexa: all
        LexaWidget: all
    run:
      config: Debug
    archive:
      config: Release
